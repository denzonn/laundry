<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#B91C1C">
    <title>Sedang Offline - Laundry</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
            background: #F8FAFC; color: #1e293b; font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .kartu { width: 100%; max-width: 380px; text-align: center; background: #fff; border-radius: 24px; padding: 32px 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
        img { width: 88px; height: 88px; }
        h1 { font-size: 20px; margin: 20px 0 8px; }
        p { margin: 0; font-size: 14px; line-height: 1.6; color: #64748b; }
        button { margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 14px; background: #B91C1C; color: #fff;
            font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
        button:hover { background: #991B1B; }
    </style>
</head>

<body>
    <main class="kartu">
        <img src="/icons/icon-192.png" alt="">
        <h1>Koneksi terputus</h1>
        <p>Perangkat sedang tidak terhubung ke internet. Data order tidak ditampilkan saat offline agar selalu yang terbaru.</p>
        <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>

</html>
